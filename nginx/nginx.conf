worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1000;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types
    text/plain
    text/markdown
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml
    font/woff2;

  # Agents sending Accept: text/markdown get the .md twin of a page when one exists.
  map $http_accept $accepts_md {
    default 0;
    "~*text/markdown" 1;
  }
  map "$accepts_md$uri" $md_file {
    default "";
    "~^1(?<p>/.+?)/?$" "$p.md";
  }
  map "$accepts_md$uri" $md_index {
    default "";
    "~^1(?<p>/.*?)/?$" "$p/index.md";
  }

  server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html index.htm;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Hashed Astro assets — long cache
    location /_astro/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    # Fonts — long cache
    location ~* \.(woff2?|ttf|otf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    # Markdown source for agents. nginx ships no .md type, and the nosniff header
    # stops the browser from rescuing an octet-stream guess.
    location ~ \.md$ {
      default_type "text/markdown; charset=utf-8";
      add_header Vary Accept;
      add_header Cache-Control "public, max-age=0, must-revalidate";
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    # HTML pages — always revalidate
    location / {
      if (-f $document_root$md_file) { rewrite ^ $md_file last; }
      if (-f $document_root$md_index) { rewrite ^ $md_index last; }
      add_header Vary Accept;
      add_header Cache-Control "public, max-age=0, must-revalidate";
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/index.html =404;
    }
  }
}
